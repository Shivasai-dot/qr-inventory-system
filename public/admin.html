<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR Inventory Admin</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-900">

<!-- LOGIN -->
<div id="login" class="hidden min-h-screen flex items-center justify-center p-4">
  <form id="loginForm" class="bg-white p-6 rounded-xl shadow w-full max-w-sm space-y-3">
    <h1 class="text-xl font-bold">Inventory Admin</h1>
    <input name="username" placeholder="Username" class="border rounded w-full p-2" required>
    <input name="password" type="password" placeholder="Password" class="border rounded w-full p-2" required>
    <p id="loginErr" class="text-red-600 text-sm"></p>
    <button class="bg-blue-600 text-white rounded w-full p-2 font-semibold">Login</button>
  </form>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <header class="bg-white shadow px-4 py-3 flex flex-wrap items-center gap-3">
    <h1 class="font-bold text-lg">QR Inventory</h1>
    <button data-tab="products" class="tab px-3 py-1 rounded">Products</button>
    <button data-tab="scan" class="tab px-3 py-1 rounded">Scan QR</button>
    <button id="logout" class="ml-auto text-sm text-gray-600 underline">Logout</button>
  </header>

  <!-- PRODUCTS TAB -->
  <main id="tab-products" class="p-4 max-w-6xl mx-auto">
    <div class="flex flex-wrap gap-2 mb-3">
      <input id="q" placeholder="Search name, code, brand" class="border rounded p-2 flex-1 min-w-[180px]">
      <select id="fCategory" class="border rounded p-2"><option value="">All categories</option></select>
      <select id="fBrand" class="border rounded p-2"><option value="">All brands</option></select>
      <button id="addBtn" class="bg-blue-600 text-white rounded px-4 py-2 font-semibold">+ Add product</button>
      <button id="printAll" class="bg-gray-800 text-white rounded px-4 py-2">Print all stickers</button>
    </div>
    <div class="bg-white rounded-xl shadow overflow-x-auto">
      <table class="w-full text-sm">
        <thead class="bg-gray-50 text-left"><tr>
          <th class="p-2">Image</th><th class="p-2">Code</th><th class="p-2">Name</th><th class="p-2">Brand</th>
          <th class="p-2">Category</th><th class="p-2">Stock</th><th class="p-2">Sell ₹</th><th class="p-2">Buy ₹</th>
          <th class="p-2">Rack</th><th class="p-2">Actions</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <p id="empty" class="hidden p-4 text-gray-500">No products found.</p>
    </div>
  </main>

  <!-- SCAN TAB -->
  <main id="tab-scan" class="hidden p-4 max-w-md mx-auto">
    <div class="bg-white rounded-xl shadow p-4 space-y-3">
      <h2 class="font-semibold">Scan a product QR code</h2>
      <div id="reader" class="w-full"></div>
      <div class="flex gap-2">
        <button id="startScan" class="bg-blue-600 text-white rounded px-4 py-2">Start camera</button>
        <button id="stopScan" class="border rounded px-4 py-2">Stop</button>
      </div>
      <p class="text-xs text-gray-500">Camera works on HTTPS or localhost. Or enter a code manually:</p>
      <div class="flex gap-2">
        <input id="manualCode" placeholder="e.g. TILE-001" class="border rounded p-2 flex-1">
        <button id="manualGo" class="bg-gray-800 text-white rounded px-4">Open</button>
      </div>
    </div>
  </main>
</div>

<!-- PRODUCT FORM MODAL -->
<div id="formModal" class="hidden fixed inset-0 bg-black/50 flex items-start justify-center p-4 overflow-y-auto z-10">
  <form id="productForm" class="bg-white rounded-xl p-5 w-full max-w-lg space-y-2 my-4">
    <h2 id="formTitle" class="font-bold text-lg"></h2>
    <input type="hidden" name="id">
    <div class="grid grid-cols-2 gap-2">
      <label class="text-xs">Product code (auto if empty)<input name="code" class="border rounded w-full p-2 text-sm read-only:bg-gray-100"></label>
      <label class="text-xs">Product name *<input name="name" required class="border rounded w-full p-2 text-sm"></label>
      <label class="text-xs">Brand / company<input name="brand" class="border rounded w-full p-2 text-sm"></label>
      <label class="text-xs">Category<input name="category" class="border rounded w-full p-2 text-sm"></label>
      <label class="text-xs">Stock quantity<input name="stock" type="number" min="0" value="0" class="border rounded w-full p-2 text-sm"></label>
      <label class="text-xs">Rack / location<input name="rack_location" class="border rounded w-full p-2 text-sm"></label>
      <label class="text-xs">Selling price<input name="selling_price" type="number" min="0" step="0.01" value="0" class="border rounded w-full p-2 text-sm"></label>
      <label class="text-xs">Purchase price<input name="purchase_price" type="number" min="0" step="0.01" value="0" class="border rounded w-full p-2 text-sm"></label>
      <label class="text-xs">Size<input name="size" class="border rounded w-full p-2 text-sm"></label>
      <label class="text-xs">Material<input name="material" class="border rounded w-full p-2 text-sm"></label>
      <label class="text-xs col-span-2">Dimensions<input name="dimensions" class="border rounded w-full p-2 text-sm"></label>
      <label class="text-xs col-span-2">Product image<input name="image" type="file" accept="image/*" class="w-full text-sm"></label>
    </div>
    <p id="formErr" class="text-red-600 text-sm"></p>
    <div class="flex justify-end gap-2 pt-2">
      <button type="button" id="cancelForm" class="border rounded px-4 py-2">Cancel</button>
      <button class="bg-blue-600 text-white rounded px-4 py-2 font-semibold">Save</button>
    </div>
  </form>
</div>

<!-- QR MODAL -->
<div id="qrModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-10">
  <div class="bg-white rounded-xl p-5 text-center space-y-2">
    <h2 id="qrName" class="font-bold"></h2>
    <img id="qrImg" class="mx-auto w-64 h-64" alt="QR code">
    <p id="qrCode" class="text-sm text-gray-600"></p>
    <div class="flex justify-center gap-2">
      <button id="qrPrint" class="bg-gray-800 text-white rounded px-4 py-2">Print sticker</button>
      <a id="qrDownload" class="border rounded px-4 py-2" download>Download PNG</a>
      <button id="qrClose" class="border rounded px-4 py-2">Close</button>
    </div>
  </div>
</div>

<script>
let token = null;
try { token = localStorage.getItem('token'); } catch (e) {}
let products = [];
let scanner = null;
let currentQR = null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function api(path, opts = {}) {
  opts.headers = Object.assign({}, opts.headers, { Authorization: 'Bearer ' + token });
  const r = await fetch(path, opts);
  if (r.status === 401) { logout(); throw new Error('Session expired'); }
  return r;
}
function logout() { try { localStorage.removeItem('token'); } catch (e) {} token = null; show(); }
function show() {
  $('login').classList.toggle('hidden', !!token);
  $('app').classList.toggle('hidden', !token);
  if (token) { setTab('products'); load(); }
}
function setTab(t) {
  $('tab-products').classList.toggle('hidden', t !== 'products');
  $('tab-scan').classList.toggle('hidden', t !== 'scan');
  document.querySelectorAll('.tab').forEach(b => {
    b.className = 'tab px-3 py-1 rounded ' + (b.dataset.tab === t ? 'bg-blue-600 text-white' : 'bg-gray-200');
  });
  if (t !== 'scan') stopScan();
}

// ---- Login
$('loginForm').onsubmit = async e => {
  e.preventDefault();
  const f = new FormData(e.target);
  const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: f.get('username'), password: f.get('password') }) });
  if (!r.ok) { $('loginErr').textContent = 'Invalid username or password'; return; }
  token = (await r.json()).token;
  try { localStorage.setItem('token', token); } catch (e) {}
  $('loginErr').textContent = '';
  show();
};
$('logout').onclick = logout;
document.querySelectorAll('.tab').forEach(b => b.onclick = () => setTab(b.dataset.tab));

// ---- Load / render
async function load() {
  const p = new URLSearchParams({ q: $('q').value, category: $('fCategory').value, brand: $('fBrand').value });
  const r = await api('/api/products?' + p);
  products = await r.json();
  render();
  if (!$('fCategory').dataset.ready || !$('q').value) refreshFilters();
}
async function refreshFilters() {
  const all = await (await api('/api/products')).json();
  const fill = (sel, key) => {
    const cur = sel.value;
    const vals = [...new Set(all.map(p => p[key]).filter(Boolean))].sort();
    sel.innerHTML = `<option value="">All ${key === 'brand' ? 'brands' : 'categories'}</option>` +
      vals.map(v => `<option>${esc(v)}</option>`).join('');
    sel.value = vals.includes(cur) ? cur : '';
  };
  fill($('fCategory'), 'category'); fill($('fBrand'), 'brand');
  $('fCategory').dataset.ready = '1';
}
function render() {
  $('empty').classList.toggle('hidden', products.length > 0);
  $('rows').innerHTML = products.map(p => `
    <tr class="border-t" data-id="${p.id}">
      <td class="p-2">${p.image_url ? `<img src="${esc(p.image_url)}" class="w-12 h-12 object-cover rounded">` : '—'}</td>
      <td class="p-2 font-mono">${esc(p.code)}</td>
      <td class="p-2">${esc(p.name)}</td>
      <td class="p-2">${esc(p.brand)}</td>
      <td class="p-2">${esc(p.category)}</td>
      <td class="p-2 whitespace-nowrap">
        <button data-act="dec" class="border rounded px-2">−</button>
        <b class="${p.stock <= 0 ? 'text-red-600' : p.stock <= 5 ? 'text-amber-600' : ''}">${p.stock}</b>
        <button data-act="inc" class="border rounded px-2">+</button></td>
      <td class="p-2">${p.selling_price}</td>
      <td class="p-2">${p.purchase_price}</td>
      <td class="p-2">${esc(p.rack_location)}</td>
      <td class="p-2 whitespace-nowrap space-x-1">
        <button data-act="qr" class="text-blue-600 underline">QR</button>
        <button data-act="edit" class="text-blue-600 underline">Edit</button>
        <button data-act="del" class="text-red-600 underline">Delete</button></td>
    </tr>`).join('');
}
let timer;
$('q').oninput = () => { clearTimeout(timer); timer = setTimeout(load, 250); };
$('fCategory').onchange = load; $('fBrand').onchange = load;

$('rows').onclick = async e => {
  const act = e.target.dataset.act; if (!act) return;
  const id = e.target.closest('tr').dataset.id;
  const p = products.find(x => String(x.id) === id);
  if (act === 'edit') openForm(p);
  if (act === 'qr') showQR(p);
  if (act === 'del' && confirm(`Delete "${p.name}"?`)) { await api('/api/products/' + id, { method: 'DELETE' }); load(); }
  if (act === 'inc' || act === 'dec') {
    const stock = Math.max(0, p.stock + (act === 'inc' ? 1 : -1));
    await api(`/api/products/${id}/stock`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ stock }) });
    load();
  }
};

// ---- Add / edit form
function openForm(p) {
  const f = $('productForm'); f.reset();
  $('formTitle').textContent = p ? 'Edit product' : 'Add product';
  $('formErr').textContent = '';
  f.elements.id.value = p ? p.id : '';
  ['code','name','brand','category','stock','selling_price','purchase_price','size','material','dimensions','rack_location']
    .forEach(k => { f.elements[k].value = p ? (p[k] ?? '') : (['stock','selling_price','purchase_price'].includes(k) ? 0 : ''); });
  f.elements.code.readOnly = !!p;
  $('formModal').classList.remove('hidden');
}
$('addBtn').onclick = () => openForm(null);
$('cancelForm').onclick = () => $('formModal').classList.add('hidden');
$('productForm').onsubmit = async e => {
  e.preventDefault();
  const f = e.target, id = f.elements.id.value;
  const data = new FormData(f); data.delete('id');
  const r = await api(id ? '/api/products/' + id : '/api/products', { method: id ? 'PUT' : 'POST', body: data });
  if (!r.ok) { $('formErr').textContent = (await r.json()).error || 'Save failed'; return; }
  $('formModal').classList.add('hidden');
  await load(); refreshFilters();
};

// ---- QR + stickers
async function qrDataUrl(id) {
  const blob = await (await api(`/api/products/${id}/qr`)).blob();
  return new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(blob); });
}
async function showQR(p) {
  currentQR = p;
  const url = await qrDataUrl(p.id);
  $('qrImg').src = url; $('qrDownload').href = url; $('qrDownload').download = p.code + '.png';
  $('qrName').textContent = p.name; $('qrCode').textContent = p.code;
  $('qrModal').classList.remove('hidden');
}
$('qrClose').onclick = () => $('qrModal').classList.add('hidden');
$('qrPrint').onclick = () => printStickers([currentQR]);
$('printAll').onclick = () => printStickers(products);
async function printStickers(list) {
  if (!list.length) return;
  const cells = [];
  for (const p of list) cells.push(`<div class="s"><img src="${await qrDataUrl(p.id)}"><b>${esc(p.name)}</b><span>${esc(p.code)}</span></div>`);
  const w = window.open('', '_blank');
  if (!w) { alert('Allow pop-ups to print stickers'); return; }
  w.document.write(`<!doctype html><title>QR Stickers</title><style>
    body{margin:10mm;font-family:sans-serif}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:6mm}
    .s{border:1px dashed #999;padding:4mm;text-align:center;break-inside:avoid;display:flex;flex-direction:column;gap:2mm}
    img{width:100%}b{font-size:12px}span{font-size:11px;color:#555}</style><div class="g">${cells.join('')}</div>`);
  w.document.close(); w.focus(); setTimeout(() => w.print(), 400);
}

// ---- Scanner
function openCode(text) {
  let code = text.trim();
  try { const u = new URL(code); const m = u.pathname.match(/^\/p\/(.+)$/); if (m) code = decodeURIComponent(m[1]); } catch (e) {}
  window.open(`/p/${encodeURIComponent(code)}?token=${encodeURIComponent(token)}`, '_blank');
}
$('startScan').onclick = async () => {
  if (scanner) return;
  scanner = new Html5Qrcode('reader');
  try {
    await scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: 240 }, text => { stopScan(); openCode(text); });
  } catch (e) { alert('Cannot start camera: ' + e); scanner = null; }
};
async function stopScan() {
  if (!scanner) return;
  const s = scanner; scanner = null;
  try { await s.stop(); s.clear(); } catch (e) {}
}
$('stopScan').onclick = stopScan;
$('manualGo').onclick = () => { if ($('manualCode').value.trim()) openCode($('manualCode').value); };

show();
</script>
</body>
</html>
